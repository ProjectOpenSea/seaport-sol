name: Auto-tag commit with YY-MM-DD-branchname

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write

# Pushes to the same branch tag in order, so the newest commit keeps the tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Moves the tag to this commit if an earlier push today already set it.
      - name: Tag commit with YY-MM-DD-branchname
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          tag="$(date +%y-%m-%d)-$BRANCH"
          git tag --force "$tag"
          git push --force origin "refs/tags/$tag"
